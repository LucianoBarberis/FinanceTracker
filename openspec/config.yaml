# openspec/config.yaml
schema: spec-driven

context: |
  Stack: ASP.NET Core 10.0 (Minimal API) + PostgreSQL + React 19 + Vite
  Backend: EF Core, JWT Bearer, FluentValidation, BCrypt
  Frontend: Redux Toolkit, React Router, Zod, PWA
  Architecture: Separate frontend/backend, REST API patterns

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: 2026-04-30
  test_runner:
    command: "dotnet test / npm test"
    framework: ".NET (built-in) / None for frontend"
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality_tools:
    linter:
      available: true
      command: "eslint . (frontend)"
    type_checker:
      available: true
      command: "tsc --noEmit (frontend), dotnet build (backend)"
    formatter:
      available: true
      command: "vite formatting / dotnet format"
